# `docker compose up -d` starts the dependencies only, for running the app on
# the host. `docker compose --profile app up -d --build` also builds and runs
# the migration and the app in containers.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skeleton
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skeleton"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: kafka:29092 for containers, localhost:9092 for the host.
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # OpenTelemetry collector + Tempo (traces) + Prometheus (metrics) + Grafana
  # in one container. Grafana: http://localhost:3000
  otel:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC

  migrate:
    profiles: [app]
    build: .
    command: ["--mode=migration"]
    environment:
      APP_POSTGRES__DSN: postgres://postgres:postgres@postgres:5432/skeleton?sslmode=disable
      APP_TELEMETRY__ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }

  app:
    profiles: [app]
    build: .
    command: ["--mode=app"]
    ports: ["8080:8080", "9090:9090"]
    environment:
      APP_POSTGRES__DSN: postgres://postgres:postgres@postgres:5432/skeleton?sslmode=disable
      APP_REDIS__ADDR: redis:6379
      APP_KAFKA__BROKERS: kafka:29092
      APP_TELEMETRY__OTLP_ENDPOINT: otel:4317
    # Must exceed shutdown.timeout so Docker does not SIGKILL a draining app.
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

volumes:
  postgres-data:
