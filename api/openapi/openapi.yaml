openapi: 3.0.3
info:
  title: Go Skeleton API
  version: 1.0.0
  description: Example REST API served by the skeleton application.
servers:
  - url: http://localhost:8080
# Every operation takes a Keycloak access token. Which operations are public
# and which are rate limited is decided by endpoints.rules in the app config.
security:
  - bearerAuth: []
paths:
  /v1/items:
    get:
      operationId: listItems
      summary: List items
      tags: [items]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemList" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createItem
      summary: Create an item
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemRequest" }
      responses:
        "201":
          description: The created item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/items:search:
    get:
      operationId: searchItems
      summary: Search items by name or description
      description: Case-insensitive substring match against name and description.
      tags: [items]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of matching items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemList" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getItem
      summary: Get an item by ID
      tags: [items]
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404":
          description: Item not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: updateItem
      summary: Update an item
      description: Only the fields present in the body are changed.
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateItemRequest" }
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Item not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteItem
      summary: Delete an item
      tags: [items]
      responses:
        "204":
          description: Item deleted
        "404":
          description: Item not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/orders:
    post:
      operationId: createOrder
      summary: Create an order
      description: >
        Prices the lines for the customer (item prices, the best discount the
        customer's groups give, conversion to the order currency) and stores
        the result. Amounts are in minor units (cents).
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: The created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOrder
      summary: Get an order by ID
      tags: [orders]
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          description: Order not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Request body larger than the server accepts
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Item:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateItemRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    UpdateItemRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    ItemList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        total: { type: integer, format: int64 }
    CreateOrderRequest:
      type: object
      required: [customer_id, currency, lines]
      additionalProperties: false
      properties:
        customer_id: { type: string, format: uuid }
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code the order is priced in
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/CreateOrderLine" }
    CreateOrderLine:
      type: object
      required: [item_id, quantity]
      additionalProperties: false
      properties:
        item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
    Order:
      type: object
      required: [id, customer_id, currency, lines, total_amount, created_at]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        currency: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        total_amount:
          type: integer
          format: int64
          description: Sum of the line amounts, in minor units
        created_at: { type: string, format: date-time }
    OrderLine:
      type: object
      required: [item_id, quantity, unit_amount, discount_basis_points, amount]
      properties:
        item_id: { type: string, format: uuid }
        quantity: { type: integer }
        unit_amount:
          type: integer
          format: int64
          description: Price of one unit in the order currency, before discount
        discount_basis_points:
          type: integer
          description: Discount applied to the line; 100 basis points are 1%
        amount:
          type: integer
          format: int64
          description: What the line costs after the discount
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
