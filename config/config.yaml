# Local development configuration. Every key can be overridden with an
# environment variable: APP_ prefix, upper case, "__" between nesting levels,
# e.g. APP_HTTP__PORT=8081 or APP_POSTGRES__DSN=postgres://...
service:
  name: go-skeleton
  version: dev
  environment: local
  domain: ""   # business domain, e.g. sales; attached to logs, traces and metrics when set

log:
  level: debug   # debug | info | warn | error
  format: text   # json | text

http:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_body_bytes: 1048576   # larger request bodies get 413

grpc:
  host: 0.0.0.0
  port: 9090
  reflection: true

postgres:
  dsn: postgres://postgres:postgres@localhost:5432/skeleton?sslmode=disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

redis:
  addr: localhost:6379
  username: ""
  password: ""
  db: 0
  cache_ttl: 5m

kafka:
  enabled: true
  brokers: [localhost:9092]
  client_id: go-skeleton
  items_topic: items.events
  consumer_group: go-skeleton

# OTLP export, configured per signal. Protocol: grpc | http. The URL scheme
# selects TLS (http:// plain, https:// TLS); for http a URL without a path
# gets /v1/traces, /v1/metrics or /v1/logs appended.
# Instana agent: grpc on :4317, http on :4318, no key needed. Instana backend
# directly: set instana_key (better: APP_TELEMETRY__INSTANA_KEY).
telemetry:
  tracing_enabled: true
  tracing_endpoint_url: http://localhost:4317
  tracing_protocol: grpc
  trace_sampling: 1.0
  metrics_enabled: true
  metrics_endpoint_url: http://localhost:4318
  metrics_protocol: http
  metric_interval: 15s
  logging_enabled: true
  logging_endpoint_url: http://localhost:4317
  logging_protocol: grpc
  instana_key: ""

# Keycloak access token verification. Tokens are verified locally against
# the realm's signing keys, which are fetched and refreshed in the background.
auth:
  enabled: true
  issuer: http://localhost:8081/realms/skeleton
  jwks_url: ""   # default: <issuer>/protocol/openid-connect/certs
  audience: go-skeleton   # tokens must carry this value in their "aud" claim
  leeway: 10s

rate_limit:
  enabled: true

# Per-endpoint access rules, shared by HTTP and gRPC. An endpoint that no rule
# mentions requires a valid token and has no rate limit.
#   http: OpenAPI operationIds        grpc: package.Service/Method
# Endpoints in one rule share one rate limit bucket per user (token "sub").
endpoints:
  rules:
    - name: read-items
      http: [listItems, getItem, searchItems]
      grpc: [item.v1.ItemService/ListItems, item.v1.ItemService/GetItem, item.v1.ItemService/SearchItems]
      rate_limit: { requests: 120, period: 1m }
    - name: write-items
      http: [createItem, updateItem, deleteItem]
      grpc: [item.v1.ItemService/CreateItem, item.v1.ItemService/UpdateItem, item.v1.ItemService/DeleteItem]
      rate_limit: { requests: 20, period: 1m, burst: 5 }
    - name: read-orders
      http: [getOrder]
      grpc: [order.v1.OrderService/GetOrder]
      rate_limit: { requests: 120, period: 1m }
    - name: write-orders
      http: [createOrder]
      grpc: [order.v1.OrderService/CreateOrder]
      rate_limit: { requests: 20, period: 1m, burst: 5 }

shutdown:
  timeout: 20s
  drain_delay: 0s   # set to ~5s on Kubernetes
